<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recetario de Nati y David</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f1f4ee;--card:#fff;--ink:#1d2a22;--mut:#5e6b62;--ac:#1f5b45;--hi:#e7a82a;--line:#d6ddd3;--chip:#e3ebe0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1b261f;--ink:#eaf0e8;--mut:#9fb0a4;--ac:#6fcf9f;--hi:#e7a82a;--line:#2d3b32;--chip:#243229}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1b261f;--ink:#eaf0e8;--mut:#9fb0a4;--ac:#6fcf9f;--hi:#e7a82a;--line:#2d3b32;--chip:#243229}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:980px;margin:0 auto;padding:16px}
h1,h2,h3{line-height:1.15;margin:0 0 .5rem}h1{font-size:2rem;font-weight:800}h2{font-size:1.4rem}h3{font-size:1.05rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.who button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:99px;font:inherit;cursor:pointer}
.who button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:14px 2px;font:inherit;font-size:.82rem;cursor:pointer}
nav button.on{color:var(--ac);font-weight:800;box-shadow:inset 0 3px var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.card.flat{cursor:default}
.ph{height:84px;border-radius:9px;display:flex;align-items:flex-end;padding:8px;font-weight:800;font-size:1.5rem;color:#fff;margin:-4px -4px 4px}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:1px 10px;font-size:.78rem;color:var(--mut)}
.chip.ok{background:var(--ac);color:var(--bg)}.chip.warn{background:var(--hi);color:#222}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:110px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.row>input[type=search]{flex:1;min-width:160px}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--ac);border:1px solid var(--ac)}
.mut{color:var(--mut)}.small{font-size:.85rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;min-width:720px;width:100%}th,td{border:1px solid var(--line);padding:4px;vertical-align:top;font-size:.82rem}
td select{width:100%;max-width:150px;font-size:.8rem;padding:4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:min(680px,100%);max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
li{margin:3px 0}
.shop label{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const IG=[["Desayunos","Tortitas saladas","reel","C_qDg-zh_Fu"],["Desayunos","Cheesecake","reel","DdeOvOTMzbK"],["Desayunos","Sándwich","reel","CyrFDV7NrPT"],
["Comidas y cenas","Fiambre de pavo","reel","C_nUDK4ofwx"],["Comidas y cenas","Salmorejo de remolacha","p","CxsduT3sURJ"],["Comidas y cenas","Tacos de zanahoria","reel","C9w83F-ufOl"],["Comidas y cenas","Nachos con guacamole","reel","C6g7mivIymf"],["Comidas y cenas","Papas con mojo","reel","Cy2yK3Dof2-"],["Comidas y cenas","Sopa cremosa de pollo con huevo pochado","reel","DfPKDFjo9rY"],["Comidas y cenas","Sopa de pollo","reel","DebtOZkuikv"],["Comidas y cenas","Carne picada rellena","reel","C-xw1DJsGXF"],["Comidas y cenas","Hamburguesas","reel","C9AU6retZNJ"],["Comidas y cenas","Pizza de garbanzos","reel","C8AWi7wiL-M"],["Comidas y cenas","Pizza de queso cottage","reel","C8mpRcZNCOu"],["Comidas y cenas","Masa de pizza","reel","C4ECTX5tCv2"],["Comidas y cenas","Lentejas con pollo","reel","C-80JBlheN1"],["Comidas y cenas","Lentejas al curry","reel","CoDUxSNost0"],["Comidas y cenas","Garbanzos con bacalao","reel","C4BLCHetvGb"],["Comidas y cenas","Garbanzos con gambas","reel","DeFIrO9tZWp"],["Comidas y cenas","Arroz con pollo, ajo y miel","p","C1vt9GySxN2"],["Comidas y cenas","Arroz meloso con pollo y cerveza","reel","CqTaSWFtu_q"],["Comidas y cenas","Arroz meloso con alitas adobadas","reel","Cz4Q3i6NLkP"],["Comidas y cenas","Arroz meloso con gambas al ajillo","reel","CzHXaIurIhG"],["Comidas y cenas","Arroz meloso de pollo con miel y mostaza","reel","CytceuPtkV0"],["Comidas y cenas","Pollo a la toscana","reel","C40v3dypMeU"],["Comidas y cenas","Pollo a la catalana","reel","C09yqE-tAI-"],["Comidas y cenas","Pollo con limón","reel","Cnw-6KfpBxw"],["Comidas y cenas","Merluza con gambas al ajillo","reel","DCCshOqoLFy"],
["Salsas","Mayonesa","reel","C9xNAi8Ox3d"],["Salsas","Salsa de curry, mango y yogur griego","reel","DA0qTDEN1zs"],["Postres","Tarta de coulant","reel","CzLvgHhI7tP"],["Postres","Pastéis de Belém","reel","C0wGTkBrOtk"]];
const FID={id:"fideos",t:"Fideos integrales con gambas y calamares al microondas",c:"Comidas y cenas",app:["Microondas"],min:17,
ing:["Fideos integrales (o espaguetis integrales cortados)","Gambas (abundantes)","1 bote de pisto preparado","1 cucharadita de café de tomate concentrado","Fumet de marisco rebajado con agua","Pimienta","Pimentón de la Vera","Calamares en conserva"],
steps:["Poner la pasta integral cortada en una fuente de cristal.","Añadir abundantes gambas.","Incorporar el pisto, el tomate concentrado, el fumet, agua, pimienta y pimentón.","Cubrir con film apto para microondas, con pequeñas perforaciones.","Cocinar 17 minutos en el microondas (la potencia no está registrada).","Comprobar el punto de la pasta y la cocción de las gambas.","Añadir los calamares al terminar."],
note:"Receta probada por David. Cantidades de pasta, gambas, agua y fumet sin documentar. Se preparó sin sal y con calamares en su tinta (la versión original usaba salsa americana). Enlace de Instagram asumido: «Fideos a la cazuela con gambas al microondas»; confírmalo.",ig:["reel","DeuWHxJt7Hh"]};
const BASE=[FID,...IG.map((x,i)=>({id:"i"+i,t:x[1],c:x[0],ig:[x[2],x[3]],ing:[],steps:[]}))];
const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"],MEALS=["Desayuno","Media mañana","Comida","Merienda","Cena"];
const ST=["Pendiente de probar","Probada","Favorita","No repetir"],APPS=["Placa de inducción","Horno","Microondas","Plancha eléctrica","Tostadora"];
const GUST={nati:"Pauta de partida: no le gustan los purés ni el tomate crudo. Añade aquí tus gustos y las indicaciones de tu nutricionista cuando las confirmes.",david:"Le gustan: guisos y platos de cuchara, legumbres, gambas y langostinos, pescados (salmón, caballa), arroces y pastas, pollo, patatas, champiñones, especias.\nNo le gustan: espárragos y cebolla cruda (cocinada sí).\nPan integral. Yogur griego con fruta, chía, nueces y chocolate negro."};
const mk=()=>({status:{},plan:{},done:{},chk:{},man:[],notes:"",off:{}});
let S;try{S=JSON.parse(localStorage.getItem("recetario-v1"))}catch(e){}
if(!S||!S.u){S={user:"nati",tab:"inicio",custom:[],u:{nati:mk(),david:mk()}};S.u.nati.notes=GUST.nati;S.u.david.notes=GUST.david;S.u.david.status.fideos="Favorita"}
const save=()=>{try{localStorage.setItem("recetario-v1",JSON.stringify(S))}catch(e){}};
const U=()=>S.u[S.user],NAME=()=>S.user==="nati"?"Nati":"David";
const all=()=>[...BASE,...S.custom],byId=id=>all().find(r=>r.id===id);
const e=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url=r=>r.url||(r.ig?`https://www.instagram.com/${r.ig[0]==="p"?"p":"reel"}/${r.ig[1]}/`:"");
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
let q="",cat="",only="",open=null,adding=false,slot={d:0,m:2};
const stOf=id=>U().status[id]||ST[0];
function card(r){const s=stOf(r.id),off=(r.app||[]).filter(a=>U().off[a]);
return `<button class="card" data-a="open" data-id="${r.id}"><div class="ph" style="background:hsl(${hue(r.t)} 38% 34%)">${e(r.t[0])}</div><h3>${e(r.t)}</h3><span class="mut small">${e(r.c)}${r.min?" · "+r.min+" min":""}</span><span>${s==="Favorita"?'<span class="chip ok">★ Favorita</span>':'<span class="chip">'+s+'</span>'} ${r.ing&&r.ing.length?"":'<span class="chip warn">Pendiente de revisar</span>'} ${off.length?'<span class="chip warn">'+e(off[0])+' no disponible</span>':""}</span></button>`}
function home(){const u=U(),h=new Date().getHours(),g=h<13?"Buenos días":h<20?"Buenas tardes":"Buenas noches",d=(new Date().getDay()+6)%7;
const next=MEALS.map((m,i)=>[m,u.plan[d+"|"+i]]).find(x=>x[1]&&!u.done[d+"|"+MEALS.indexOf(x[0])]);
const favs=all().filter(r=>stOf(r.id)==="Favorita"),pool=all().filter(r=>!["No repetir","Probada"].includes(stOf(r.id))),rec=pool[(new Date().getDate()*7)%pool.length];
return `<h1>${g}, ${NAME()}</h1><div class="grid"><div class="card flat"><h3>Próxima comida</h3>${next?`<b>${next[0]}</b>: ${e(lab(next[1]))}`:'<span class="mut">No hay nada pendiente hoy. Planifica tu semana.</span>'}<button class="btn ghost" data-a="tab" data-id="semana">Abrir mi semana</button></div><div class="card flat"><h3>Idea del día</h3><span>${rec?e(rec.t):"—"}</span><span class="mut small">Elegida de las recetas que aún no has probado.</span>${rec?`<button class="btn ghost" data-a="open" data-id="${rec.id}">Ver receta</button>`:""}</div></div><h2 style="margin-top:20px">Tus favoritas</h2>${favs.length?`<div class="grid">${favs.map(card).join("")}</div>`:'<p class="mut">Marca recetas como favoritas y aparecerán aquí.</p>'}`}
function recipes(){const l=all().filter(r=>(!q||(r.t+" "+(r.ing||[]).join(" ")).toLowerCase().includes(q.toLowerCase()))&&(!cat||r.c===cat)&&(!only||stOf(r.id)===only));
return `<h1>Recetas</h1><div class="row"><input type="search" id="q" placeholder="Buscar por nombre o ingrediente" value="${e(q)}" aria-label="Buscar"><select data-a="cat" aria-label="Categoría"><option value="">Todas las categorías</option>${[...new Set(all().map(r=>r.c))].map(c=>`<option ${c===cat?"selected":""}>${e(c)}</option>`).join("")}</select><select data-a="only" aria-label="Estado"><option value="">Cualquier estado</option>${ST.map(s=>`<option ${s===only?"selected":""}>${s}</option>`).join("")}</select><button class="btn" data-a="add">Añadir receta</button></div><p class="mut small">${l.length} recetas compartidas. El estado y las valoraciones son personales.</p><div class="grid">${l.map(card).join("")}</div>`}
const rid=t=>BASE.find(r=>r.t===t)?.id,X=(...p)=>p.map(x=>rid(x)||'t:'+x).join('~'),lab=v=>v.split('~').map(x=>x.startsWith('t:')?x.slice(2):(byId(x)?.t||'')).join(' + ');
const SAL='Ensalada de lechuga, zanahoria y pepino (sin tomate)',YF='Yogur natural con fruta';
function proposal(){const W=[[YF,['Lentejas con pollo',SAL],['Tortilla francesa con verduras salteadas']],['Sándwich',['Dorada al horno con verduras',SAL],['Pollo con limón','Verduras a la plancha']],[YF,['Garbanzos con bacalao',SAL],['Huevos a la plancha con verduras']],['Tortitas saladas',['Arroz con pollo, ajo y miel'],['Sardinas o boquerones a la plancha',SAL]],[YF,['Merluza con gambas al ajillo',SAL],['Revuelto de huevo con verduras']],['Sándwich',['Salteado de verduras con gambas'],['Caballa a la plancha',SAL]],[YF,['Brochetas de verduras y gambas',SAL],['Tortilla de calabacín']]],P={};W.forEach(([b,c,d],i)=>{P[i+'|0']=X(b);P[i+'|1']=X('Pieza de fruta');P[i+'|2']=X(...c);P[i+'|3']=X(YF);P[i+'|4']=X(...d)});return P}
function natiBox(){if(S.user!=='nati')return '';const u=U();return `<div class='card flat' style='margin:10px 0'><h3>Menú semanal según tu nutricionista</h3>${u.prev?`<p class='small'>Propuesta aplicada a tu semana. ¿Te sirve?</p><div class='row'><button class='btn' data-a='keep'>Quedarme con ella</button><button class='btn ghost' data-a='undo'>Deshacer</button></div>`:`<div class='row'><button class='btn' data-a='prop'>Proponer menú semanal</button></div>`}<p class='small mut'><b>Pauta original registrada:</b> verdura fresca o cruda cada día; legumbres 1-2 veces; pescado blanco 2-3; pescado azul 1-2; carne blanca 2-3; huevos 3-4 con verduras; arroz o pasta 1 vez; fruta o yogur de postre. <b>Esta propuesta:</b> 2 legumbres, 3 pescado blanco, 2 pescado azul, 3 carne blanca, 4 huevos, 1 arroz y nada de carne roja (la pauta dice 1-2 al mes).</p><p class='small mut'><b>Adaptación de la app:</b> ensaladas sin tomate crudo, sin purés ni cremas, y los desayunos, la media mañana y la merienda son sugerencias mías. <b>Pendiente de confirmar:</b> las anotaciones manuscritas sobre arroz, pasta y patata no se han aplicado como restricción.</p><p class='small mut'>Los platos sin ficha son ideas de la app, no recetas documentadas. Tus menús en PDF aún no están importados: si tu nutricionista te da otro menú, ese manda.</p></div>`}
function week(){const u=U();return `<h1>Mi semana</h1><p class="mut small">Solo tú ves este plan. Marca ✓ lo que ya has hecho.</p>${natiBox()}<div class="scroll"><table><tr><th></th>${DAYS.map(d=>`<th>${d}</th>`).join("")}</tr>${MEALS.map((m,mi)=>`<tr><th>${m}</th>${DAYS.map((d,di)=>{const k=di+"|"+mi;return `<td><select data-a="plan" data-k="${k}" aria-label="${d} ${m}"><option value="">—</option>${u.plan[k]&&!byId(u.plan[k])?`<option value="${e(u.plan[k])}" selected>${e(lab(u.plan[k]))}</option>`:""}${all().map(r=>`<option value="${r.id}" ${u.plan[k]===r.id?"selected":""}>${e(r.t)}</option>`).join("")}</select>${u.plan[k]?`<label class="small"><input type="checkbox" data-a="done" data-k="${k}" ${u.done[k]?"checked":""}> hecho</label>`:""}</td>`}).join("")}</tr>`).join("")}</table></div>`}
function items(){const m=new Map();Object.values(U().plan).forEach(v=>v.split('~').forEach(id=>(byId(id)?.ing||[]).forEach(i=>m.set(i.toLowerCase(),i))));return [...m]}
function shop(){const u=U(),it=items();return `<h1>Mi compra</h1><p class="mut small">Se genera con los ingredientes de tu semana (solo recetas con ingredientes revisados). Tu lista no se mezcla con la de ${S.user==="nati"?"David":"Nati"}.</p><div class="shop">${it.map(([k,t])=>`<label><input type="checkbox" data-a="chk" data-k="${e(k)}" ${u.chk[k]?"checked":""}>${e(t)}</label>`).join("")||'<p class="mut">Añade recetas a tu semana para generar la lista.</p>'}${u.man.map((x,i)=>`<label><input type="checkbox" data-a="mchk" data-i="${i}" ${x.d?"checked":""}>${e(x.t)}<button class="btn ghost small" data-a="mdel" data-i="${i}" style="margin-left:auto">Quitar</button></label>`).join("")}</div><div class="row"><input id="mi" placeholder="Añadir producto" aria-label="Producto"><button class="btn" data-a="madd">Añadir</button></div>`}
function profile(){const u=U();return `<h1>Perfil de ${NAME()}</h1><h3>Gustos y notas</h3><textarea data-a="notes" aria-label="Gustos y notas">${e(u.notes)}</textarea><h3 style="margin-top:16px">Electrodomésticos</h3><p class="mut small">Desmarca uno si no funciona temporalmente; vuelve a marcarlo cuando se arregle. Las recetas que lo necesiten mostrarán un aviso.</p>${APPS.map(a=>`<label style="display:block"><input type="checkbox" data-a="app" data-k="${a}" ${u.off[a]?"":"checked"}> ${a}</label>`).join("")}<h3 style="margin-top:16px">Pendiente de construir</h3><p class="mut small">Pautas de la nutricionista, analíticas y despensa aún no están en esta versión. Tus datos se guardan solo en este navegador.</p><div class="row"><button class="btn ghost" data-a="theme">Cambiar tema claro/oscuro</button></div>`}
function sheet(){if(adding)return `<div class="ov" data-a="close"><div class="sheet" data-stop><h2>Nueva receta</h2><div class="row" style="flex-direction:column"><input id="nt" placeholder="Nombre"><input id="nc" placeholder="Categoría (p. ej. Comidas y cenas)"><input id="nu" placeholder="Enlace de la fuente (opcional)"><textarea id="ni" placeholder="Ingredientes, uno por línea"></textarea><textarea id="ns" placeholder="Pasos, uno por línea"></textarea></div><button class="btn" data-a="save">Guardar</button> <button class="btn ghost" data-a="close">Cancelar</button></div></div>`;
if(!open)return "";const r=byId(open);return `<div class="ov" data-a="close"><div class="sheet" data-stop><h2>${e(r.t)}</h2><p class="mut">${e(r.c)}${r.min?" · "+r.min+" min":""}${r.app?" · "+e(r.app.join(", ")):""}</p><div class="row"><select data-a="status" data-id="${r.id}" aria-label="Estado">${ST.map(s=>`<option ${s===stOf(r.id)?"selected":""}>${s}</option>`).join("")}</select></div>${r.ing&&r.ing.length?`<h3>Ingredientes</h3><ul>${r.ing.map(i=>`<li>${e(i)}</li>`).join("")}</ul><h3>Preparación</h3><ol>${r.steps.map(s=>`<li>${e(s)}</li>`).join("")}</ol>`:'<p><span class="chip warn">Pendiente de revisar</span> Ingredientes y pasos sin verificar: abre la fuente y añádelos cuando los confirmes.</p>'}${r.note?`<p class="small mut">${e(r.note)}</p>`:""}<p><a href="${e(url(r))}" target="_blank" rel="noopener noreferrer">Ver fuente original</a></p><div class="row"><select id="sd" aria-label="Día">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select><select id="sm" aria-label="Comida">${MEALS.map((m,i)=>`<option value="${i}" ${i===2?"selected":""}>${m}</option>`).join("")}</select><button class="btn" data-a="toplan" data-id="${r.id}">Añadir a mi semana</button></div><button class="btn ghost" data-a="close">Cerrar</button></div></div>`}
function render(){const t=S.tab,v={inicio:home,recetas:recipes,semana:week,compra:shop,perfil:profile}[t];
document.getElementById("app").innerHTML=`<div class="top"><span class="mut">Recetario compartido</span><div class="who">${["nati","david"].map(n=>`<button class="${S.user===n?"on":""}" data-a="user" data-id="${n}">${n==="nati"?"Nati":"David"}</button>`).join(" ")}</div></div>${v()}${sheet()}`;
document.getElementById("nav").innerHTML=[["inicio","Inicio"],["recetas","Recetas"],["semana","Mi semana"],["compra","Mi compra"],["perfil","Perfil"]].map(([k,l])=>`<button data-a="tab" data-id="${k}" class="${t===k?"on":""}">${l}</button>`).join("");
const qi=document.getElementById("q");if(qi&&document.body.dataset.f==="q"){qi.focus();qi.setSelectionRange(q.length,q.length)}save()}
document.addEventListener("click",ev=>{const el=ev.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=el.dataset.id,u=U();
if(el.tagName==="SELECT"||el.tagName==="TEXTAREA"||el.tagName==="INPUT"&&el.type==="checkbox")return;
if(a==="close"){if(ev.target.closest("[data-stop]")&&!ev.target.closest("button"))return;open=null;adding=false}
else if(a==="user")S.user=id;else if(a==="tab"){S.tab=id;document.body.dataset.f=""}else if(a==="open")open=id;else if(a==="add")adding=true;
